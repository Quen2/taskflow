# Règles Prometheus de TaskFlow : calculs RED précalculés, puis alertes.
groups:
  # ---------------------------------------------------------------------------
  # Recording rules : RED (Rate, Errors, Duration), précalculées toutes les 15 s.
  # Nom : niveau:métrique:opérations (convention Prometheus).
  # ---------------------------------------------------------------------------
  - name: taskflow-red
    rules:
      # R : requêtes par seconde, hors healthchecks.
      - record: job:http_requests:rate5m
        expr: sum by (job) (rate(http_requests_total{route!="/health"}[5m]))

      # E : part des requêtes en erreur serveur (5xx).
      - record: job:http_errors:ratio5m
        expr: |
          sum by (job) (rate(http_requests_total{status_code=~"5.."}[5m]))
          /
          sum by (job) (rate(http_requests_total[5m]))

      # D : 95 % des requêtes passent sous cette durée (en secondes).
      - record: job:http_request_duration_seconds:p95_5m
        expr: histogram_quantile(0.95, sum by (job, le) (rate(http_request_duration_seconds_bucket[5m])))

  # ---------------------------------------------------------------------------
  # Alertes.
  # ---------------------------------------------------------------------------
  - name: taskflow-alerts
    rules:
      # Boîte noire : la sonde passe par le front, comme un utilisateur.
      - alert: TaskFlowApiDown
        expr: probe_success{job="blackbox-health"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API TaskFlow injoignable"
          description: "La sonde {{ $labels.instance }} échoue depuis plus d'une minute."
          runbook_url: "https://github.com/Quen2/taskflow/blob/main/docs/INCIDENTS.md#runbook-taskflowapidown"

      # Boîte blanche : Prometheus n'arrive plus à lire /metrics.
      - alert: TaskFlowMetricsUnreachable
        expr: up{job="taskflow-api"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Métriques de l'API illisibles"
          description: "Prometheus ne lit plus {{ $labels.instance }}/metrics depuis 2 minutes."
          runbook_url: "https://github.com/Quen2/taskflow/blob/main/docs/INCIDENTS.md#runbook-taskflowmetricsunreachable"

      # Plus de 5 % d'erreurs 5xx pendant 5 minutes.
      - alert: TaskFlowHighErrorRate
        expr: job:http_errors:ratio5m > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Taux d'erreurs 5xx élevé"
          description: "{{ $value | humanizePercentage }} des requêtes échouent (seuil : 5 %)."
          runbook_url: "https://github.com/Quen2/taskflow/blob/main/docs/INCIDENTS.md#runbook-taskflowhigherrorrate"

      # Toujours active : prouve que toute la chaîne d'alerte fonctionne.
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Watchdog : la chaîne d'alerte fonctionne"
          description: "Cette alerte est toujours active. Si elle disparaît, Prometheus ou Alertmanager est en panne."
