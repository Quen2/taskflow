# ============================================================================
# compose.staging.yaml : environnement de STAGING (pré-production)
#
#     IMAGE_TAG=<sha> docker compose -f compose.staging.yaml up -d --wait
#
# Lancé depuis ~/taskflow-staging (qui contient son propre .env).
# Mêmes images que la production (même SHA) ; seule la configuration change.
# Différences de STRUCTURE avec la prod :
#   1. pas de proxy ni de HTTPS (écart assumé pour le lab) ;
#   2. le front publie lui-même un port (8081) ;
#   3. noms de conteneurs et de volume FIXÉS (repris par OpenTofu au Jour 4).
# ============================================================================

name: taskflow-staging

services:
  db:
    image: postgres:16-alpine
    container_name: taskflow-staging-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER manquant dans .env}/taskflow-api:${IMAGE_TAG:?IMAGE_TAG manquant (IMAGE_TAG=<sha> docker compose ...)}
    container_name: taskflow-staging-api
    environment:
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL manquant dans .env}
      APP_ENV: ${APP_ENV:-staging}
      # APP_VERSION n'est PAS défini ici : il est inscrit dans l'image au build.
    depends_on:
      db:
        condition: service_healthy
    # HEALTHCHECK défini dans api/Dockerfile.
    restart: unless-stopped

  front:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER manquant dans .env}/taskflow-front:${IMAGE_TAG:?IMAGE_TAG manquant}
    container_name: taskflow-staging-front
    # Différence avec la prod : pas de proxy, le front est la porte d'entrée (HTTP).
    ports:
      - "${FRONT_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy
    # HEALTHCHECK défini dans front/Dockerfile.
    restart: unless-stopped

volumes:
  pgdata:
    # Nom fixe : le volume (et donc les données) est retrouvé à l'identique,
    # même si les conteneurs sont recréés par un autre outil (OpenTofu, Jour 4).
    name: taskflow-staging-pgdata

networks:
  default:
    name: taskflow-staging