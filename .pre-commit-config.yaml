# Hooks Git exécutés automatiquement avant chaque commit.
# Installation : pipx install pre-commit && pre-commit install
# Sans Python : remplacer "id: gitleaks" par "id: gitleaks-docker" (utilise Docker).
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks