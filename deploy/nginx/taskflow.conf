# Configuration du reverse proxy de PRODUCTION (conteneur "proxy").
# Rôle : seule porte d'entrée ; termine le HTTPS puis relaie au service "front".
# Monté dans le conteneur sur /etc/nginx/conf.d/default.conf (voir compose.prod.yaml).

# ---------- HTTP (port 80) : redirection vers HTTPS --------------------------
server {
    listen 80;
    server_name _;

    # Adresse de test pour le healthcheck du conteneur (pas de redirection).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Tout le reste : redirection permanente vers la même adresse en https.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS (port 443) : déchiffrement puis relais au front ------------
server {
    listen 443 ssl;
    server_name _;

    # Certificat et clé privée, générés par gen-cert.sh dans ./certs
    ssl_certificate     /etc/nginx/certs/taskflow.crt;
    ssl_certificate_key /etc/nginx/certs/taskflow.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        # "front" est résolu au DÉMARRAGE de Nginx : après un redéploiement du
        # front (nouveau conteneur, nouvelle IP), deploy.sh fait "nginx -s reload".
        proxy_pass http://front:80;

        # Transmettre au front les informations sur le vrai client.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}