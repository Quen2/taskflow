name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:                    # permet de répéter le job ; chaque variante = un check nom (valeur)
      fail-fast: false
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci                     # permet d'installer les packages sans les update 
      - run: npm run lint               # run le lint ( normes d'écritures / code )
      - run: npm run test:coverage      # lance les tests et récupère le coverage aussi