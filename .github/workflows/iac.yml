# =============================================================================
# iac.yml : vérifier le code OpenTofu et publier son plan dans chaque PR
#   pull_request sur infra/** -> iac-validate (GitHub) puis iac-plan (runner du lab)
#   schedule hebdomadaire     -> iac-plan échoue si l'infrastructure a DÉRIVÉ du code
# Ces checks ne sont PAS requis par le ruleset (sinon le filtre paths bloquerait
# toutes les PR qui ne touchent pas infra/ : le piège n° 1 du Jour 2).
# =============================================================================
name: IaC

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/iac.yml"
  schedule:
    - cron: "17 6 * * 1"     # lundi 6h17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # iac-validate : syntaxe et format. Chez GitHub, sans state ni Docker.
  # ---------------------------------------------------------------------------
  iac-validate:
    name: iac-validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.9
          tofu_wrapper: false

      - name: Format
        run: tofu fmt -check -recursive

      - name: Init (sans state, lock file en lecture seule)
        run: tofu init -backend=false -lockfile=readonly -input=false

      - name: Validate
        run: tofu validate

  # ---------------------------------------------------------------------------
  # iac-plan : le VRAI plan, contre le vrai state et le vrai Docker. Runner du lab.
  # Jamais pour une PR venant d'un fork ; aucun secret dans ce job.
  # ---------------------------------------------------------------------------
  iac-plan:
    name: iac-plan
    needs: iac-validate
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, lab]
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write     # publier le plan en commentaire
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Init (state du staging)
        run: tofu init -input=false -lockfile=readonly -backend-config="path=$STAGING_DIR/terraform.tfstate"

      - name: Variables (version déjà déployée)
        run: ./ci-env.sh

      - name: Plan
        id: plan
        run: |
          set +e
          tofu plan -input=false -no-color -detailed-exitcode -lock-timeout=120s -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
          {
            echo "## Plan OpenTofu (staging)"
            echo '```text'
            head -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 1 ]; then
            echo "::error::Le plan a échoué."
            exit 1
          fi

      - name: Commentaire de PR (créé ou mis à jour)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          CODE: ${{ steps.plan.outputs.code }}
        run: |
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          case "$CODE" in
            0) titre="Aucun changement" ;;
            2) titre="Changements prévus" ;;
            *) titre="Plan en échec" ;;
          esac
          # shellcheck disable=SC2016  # accents graves voulus : bloc de code Markdown
          corps="$(printf '<!-- iac-plan -->\n### Plan OpenTofu (staging) : %s\n\n```text\n%s\n```\n' \
            "$titre" "$(head -c 60000 plan.txt)")"
          donnees="$(jq -n --arg body "$corps" '{body: $body}')"
          id="$(curl -fsS "${auth[@]}" "$api/issues/$PR/comments?per_page=100" \
            | jq -r '[.[] | select(.body | startswith("<!-- iac-plan -->"))][0].id // empty')"
          if [ -n "$id" ]; then
            curl -fsS "${auth[@]}" -X PATCH "$api/issues/comments/$id" -d "$donnees" > /dev/null
            echo "Commentaire $id mis à jour."
          else
            curl -fsS "${auth[@]}" -X POST "$api/issues/$PR/comments" -d "$donnees" > /dev/null
            echo "Commentaire créé."
          fi

      - name: Dérive (passage planifié ou manuel)
        if: github.event_name != 'pull_request' && steps.plan.outputs.code == '2'
        run: |
          echo "::error::Dérive détectée : l'infrastructure du staging ne correspond plus au code."
          exit 1

      - name: Nettoyage (le plan contient des valeurs sensibles)
        if: always()
        run: rm -f tfplan plan.txt
